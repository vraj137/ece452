plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def quotedBuildConfigString = { value ->
    "\"${(value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")}\""
}
def supabaseUrl = localProperties.getProperty("SUPABASE_URL", "")
def supabaseKey = localProperties.getProperty("SUPABASE_PUBLISHABLE_KEY", "")
def mapboxPublicToken = localProperties.getProperty("MAPBOX_PUBLIC_TOKEN", "")

android {
    namespace "com.appetizers.spotra"
    compileSdk 35

    defaultConfig {
        applicationId "com.appetizers.spotra"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "SUPABASE_URL", quotedBuildConfigString(supabaseUrl)
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", quotedBuildConfigString(supabaseKey)
        buildConfigField "String", "MAPBOX_PUBLIC_TOKEN", quotedBuildConfigString(mapboxPublicToken)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "com.mapbox.maps:android:11.9.0"
    implementation "com.mapbox.extension:maps-compose:11.9.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    implementation platform("io.github.jan-tennert.supabase:bom:3.0.3")
    implementation "io.github.jan-tennert.supabase:auth-kt"
    implementation "io.github.jan-tennert.supabase:postgrest-kt"
    implementation "io.ktor:ktor-client-okhttp:3.0.3"

    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"

    androidTestImplementation platform("androidx.compose:compose-bom:2024.12.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
